  - Version: '0.3.0'
    RequiredApiVersion: '6.16.0'
    ReleaseDate: '{NEWDATE}'
    PackageUrl: 'https://github.com/Jeshibu/PlayniteExtensions/releases/download/{NEWDATE}/ImportAnalyzer_0_3_0.pext'
    Changelog:
      - "Offer to tag specific sources of imported games as missing games too. This hooks into the recent Steam plugin update that will have games in the import just for time played in the past."
