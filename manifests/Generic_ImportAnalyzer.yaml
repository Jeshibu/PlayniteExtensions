    Changelog:
      - "Initial release"
  - Version: '0.2'
    RequiredApiVersion: '6.16.0'
    ReleaseDate: '2026-07-31'
    PackageUrl: 'https://github.com/Jeshibu/PlayniteExtensions/releases/download/importanalyzer0.2/ImportAnalyzer_0_2.pext'
